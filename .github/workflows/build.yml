name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows
          - os: macos-latest
            artifact_name: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build installer
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run build && npx electron-builder --win --publish never
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run build && npx electron-builder --mac --publish never
          fi

      - name: Collect installer files
        shell: bash
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.pkg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer artifacts found in release/"
            ls -la release || true
            exit 1
          fi
          cp "${files[@]}" dist-release/
          ls -la dist-release

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist-release/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
